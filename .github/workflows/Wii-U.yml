name: Build Wii U Homebrew

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y git nodejs npm curl
    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.4

    - name: Install HMM
      run: |
        haxelib install hmm --quiet
        haxelib run hmm setup
    - name: Swap and Restore Haxe Dependencies
      run: |
        cp hmm-u.json hmm.json
        haxelib run hmm install --quiet
    - name: Install Wii U Development Environment
      run: |
        dkp-pacman -Syy --noconfirm
        dkp-pacman -S wiiu-dev --noconfirm
        dkp-pacman -Sy --noconfirm
        dkp-pacman -S --needed wiiu-dev --noconfirm
        dkp-pacman -S wiiu-sdl2 wiiu-sdl2_gfx wiiu-sdl2_image wiiu-sdl2_mixer wiiu-sdl2_ttf --noconfirm
        dkp-pacman -S ppc-jansson ppc-zlib ppc-libvorbis ppc-libopus ppc-libogg ppc-libjpeg-turbo ppc-freetype ppc-bzip2 ppc-libpng --noconfirm
        dkp-pacman -S wiiu-curl --noconfirm
        
    - name: Configure DevKitPro Environment Paths
      run: |
        echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
        echo "DEVKITPPC=/opt/devkitpro/devkitPPC" >> $GITHUB_ENV
        echo "PATH=/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH" >> $GITHUB_ENV
    - name: Build hxCompileU Compiler Utility
      run: |
        haxelib install hxcpp --quiet
        git clone https://github.com/Slushi-Github/hxCompileU.git BuildTool
        cd BuildTool
        haxe build.hxml
        find export/ -maxdepth 1 -type f -executable -exec mv {} ../hxCompileU \;
        cd ..
    - name: Create Base Wii U Configuration File
      run: |
        echo '{
          "haxeConfig": {
            "hxmlPath": "build.hxml"
          },
          "wiiuConfig": {
            "outputFolder": "output",
            "wiiuFilesFolder": "wiiuFiles",
            "convertToWUHB": false,
            "wuhbConfig": {
              "name": "DELTASHIT",
              "author": "Ethantobot",
              "version": "1.4.0"
            }
          }
        }' > hxCompileUConfig.json
    - name: Compile Project to Wii U Binaries
      run: |
        chmod +x ./hxCompileU
        ./hxCompileU --compile
        
    - name: Upload Wii U Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wiiu-homebrew-release
        path: |
          output/wiiuFiles/*.rpx
          output/wiiuFiles/*.elf
          output/wiiuFiles/*.wuhb
