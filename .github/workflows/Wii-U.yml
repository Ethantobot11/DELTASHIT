name: Build Wii U Port

on: [push, pull_request]

env:
  HAXE_VERSION: 4.2.5

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Utilities & Haxe
        run: |
          apt-get update && apt-get install -y patchelf python3-pip python3-setuptools
          pip3 install staticx --break-system-packages

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM (Haxe Module Manager)
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm
          haxelib run hmm setup
          cp hmm-u.json hmm.json
          haxelib run hmm install

      - name: Build HxCompileU Compiler Utility
        run: |
          git clone https://github.com/Slushi-Github/hxCompileU.git
          cd hxCompileU
          haxe build.hxml
          cp export/haxeCompileU ../haxeCompileU
          cd ..

      - name: Install Missing Native Wii U OS Libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed wiiu-dev --noconfirm
          dkp-pacman -S wiiu-sdl2 wiiu-sdl2_gfx wiiu-sdl2_image wiiu-sdl2_mixer wiiu-sdl2_ttf --noconfirm
          dkp-pacman -S ppc-jansson ppc-zlib ppc-libvorbis ppc-libopus ppc-libogg ppc-libjpeg-turbo ppc-freetype ppc-bzip2 ppc-libpng --noconfirm
          dkp-pacman -S wiiu-curl --noconfirm

      - name: Initialize Leafy Configuration and Compile
        run: |
          ./haxeCompileU --import leafyEngine
          ./haxeCompileU --compile
