name: Build Wii U Homebrew

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y git nodejs npm curl make

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.4

    - name: Install HMM (Haxe Module Manager)
      run: |
        haxelib install hmm
        haxelib run hmm setup

    - name: Swap and Restore Haxe Dependencies (Wii U Setup)
      run: |
        cp hmm-u.json hmm.json
        haxelib run hmm install

    - name: Install Wii U Development Environment
      run: |
        dkp-pacman -Syy --noconfirm
        dkp-pacman -S wiiu-dev --noconfirm

    - name: Configure DevKitPro Environment Paths
      run: |
        echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
        echo "DEVKITPPC=/opt/devkitpro/devkitPPC" >> $GITHUB_ENV
        echo "PATH=/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH" >> $GITHUB_ENV

    - name: Step 1 - Generate C++ Source via Reflaxe
      run: |
        haxe build.hxml -D wiiu

    - name: Step 2 - Compile C++ to Wii U Binaries via Make
      run: |
        if [ -f Makefile ]; then
          make
        else
          echo "No root Makefile found. Ensure your project has a Makefile matching devkitPro structures."
          exit 1
        fi

    - name: Upload Wii U Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wiiu-homebrew-release
        path: |
          *.rpx
          *.elf
          *.wuhb
          wiiuFiles/*
